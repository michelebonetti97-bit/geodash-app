<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoDash Pro - Corretto</title>
    <style>
        /* Inserisci qui il tuo CSS originale */
    </style>
</head>
<body>
<script>
    // ... (Variabili globali e funzioni di utilità iniziali)

    // CORREZIONE: Consolidamento del salvataggio dati
    function saveToStorage() {
        localStorage.setItem("ios_gd_entries", JSON.stringify(entries));
        localStorage.setItem("ios_gd_archive", JSON.stringify(archive));
        localStorage.setItem("ios_gd_params", JSON.stringify(params));
        localStorage.setItem("ios_gd_preventivi", JSON.stringify(preventivi)); // Salvataggio unificato
    }

    function loadFromStorage() {
        const le = localStorage.getItem("ios_gd_entries");
        const la = localStorage.getItem("ios_gd_archive");
        const lp = localStorage.getItem("ios_gd_params");
        const lp_prev = localStorage.getItem("ios_gd_preventivi");

        if(le) entries = JSON.parse(le); else entries = FALLBACK_DATA;
        if(la) archive = JSON.parse(la);
        if(lp) {
            params = JSON.parse(lp);
            // Assicurati che gli input vengano aggiornati solo se esistono nel DOM
            const pFields = ['p-coeff', 'p-tasse', 'p-cipag', 'p-comm', 'p-ordine'];
            pFields.forEach(id => {
                const el = document.getElementById(id);
                if(el) el.value = params[id.replace('p-', '') === 'coeff' ? 'coeff' : id.replace('p-', '')];
            });
        }
        if(lp_prev) preventivi = JSON.parse(lp_prev);
        
        render();
        renderPreventiviSalvati();
    }

    // CORREZIONE: Gestione sicura del Prezziario e Preventivi
    window.selectServizio = function(serviziId, categoria) {
        const qty = parseFloat(document.getElementById('prev-qty').value) || 1;
        const servizio = PREZZIARI[categoria].find(s => s.id === serviziId);
        
        if (!servizio) return;
        
        vociCorrente.push({
            id: serviziId + '_' + Date.now(),
            nome: servizio.nome,
            prezzo: servizio.prezzo,
            um: servizio.um,
            qty: qty
        });
        
        renderVociCorrente();
    }

    // Inizializzazione corretta
    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        const dateInputs = document.querySelectorAll('input[type="date"]');
        dateInputs.forEach(i => i.value = today);
        
        loadFromStorage();
    };

    // ... (Resto delle funzioni di render e calcolo)
</script>
</body>
</html>
