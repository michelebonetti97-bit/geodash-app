<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoDash Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-main: #000000;
            --bg-card: #111827;
            --primary: #10b981;
            --secondary: #3b82f6;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 90px; }
        .container { max-width: 600px; margin: 0 auto; padding: 1.25rem; }
        
        .header { margin-bottom: 1.5rem; }
        .header h1 { font-size: 28px; font-weight: 800; color: var(--primary); }

        .section-panel { display: none; }
        .section-panel.active { display: block; }

        .card { background: var(--bg-card); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1.25rem; border: 1px solid var(--border); }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 1rem; color: var(--text-main); }

        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-success { background: var(--primary); color: #000; }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #000; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 15px 0; z-index: 1000; }
        .tab-item { cursor: pointer; color: var(--text-muted); font-size: 10px; font-weight: 600; }
        .tab-item.active { color: var(--primary); }

        .bando-link { display: block; padding: 12px; background: #1f2937; border-radius: 8px; margin-bottom: 8px; color: var(--text-main); text-decoration: none; font-size: 14px; border: 1px solid var(--border); }
        .bando-link:hover { border-color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>GeoDash Pro</h1>
    </div>

    <div id="panel-dashboard" class="section-panel active">
        <div class="card">
            <div class="card-title">Riepilogo</div>
            <div id="stats" style="font-size: 14px;">In attesa di dati...</div>
        </div>
        <div class="card"><canvas id="barChart"></canvas></div>
    </div>

    <div id="panel-ai" class="section-panel">
        <div class="card">
            <div class="card-title">Radar Bandi & Opportunità</div>
            <a href="https://www.inpa.gov.it/" class="bando-link">Concorsi Pubblici (inPA) ↗</a>
            <a href="https://www.cngeologi.it/category/bandi-e-concorsi/" class="bando-link">Consiglio Nazionale Geologi ↗</a>
            <a href="https://www.gazzettaufficiale.it/concorsi" class="bando-link">Gazzetta Ufficiale ↗</a>
        </div>
    </div>
</div>

<nav class="tab-bar">
    <div class="tab-item active" onclick="nav('panel-dashboard', this)">DASHBOARD</div>
    <div class="tab-item" onclick="nav('panel-ai', this)">AI & BANDI</div>
</nav>

<script>
    function nav(id, el) {
        document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }
</script>
</body>
</html>
