<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoDash iOS Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-main: #000000;
            --bg-card: #111827;
            --bg-card-inner: #1f2937;
            --primary: #10b981;    /* Verde Smeraldo Originale */
            --secondary: #3b82f6;  /* Blu Elettrico Originale */
            --accent: #f59e0b;     /* Arancione Originale */
            --danger: #ef4444;     /* Rosso Originale */
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
            --radius-ios: 12px;
            --radius-round: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            padding-bottom: 90px; /* Spazio per la barra inferiore fissa */
            padding-top: env(safe-area-inset-top);
        }

        .container { max-width: 600px; margin: 0 auto; padding: 1.25rem; }
        
        .ios-header { margin-bottom: 1.5rem; padding-top: 10px; }
        .ios-header h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; color: var(--text-main); }
        .ios-subtitle { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 2px; }

        /* Pannelli delle Sezioni */
        .section-panel { display: none; animation: iosFade 0.2s ease-in-out; }
        .section-panel.active { display: block; }
        @keyframes iosFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* Card (Stile Originale) */
        .ios-card { background: var(--bg-card); border-radius: var(--radius-ios); padding: 1.25rem; margin-bottom: 1.25rem; border: 1px solid var(--border); }
        .ios-card-title { font-size: 16px; font-weight: 600; margin-bottom: 1rem; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }

        /* Griglia dei contatori numerici */
        .ios-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 1.25rem; }
        .ios-stat-box { background: var(--bg-card); border-radius: var(--radius-ios); padding: 1rem; border: 1px solid var(--border); }
        .ios-stat-box .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.3px; }
        .ios-stat-box .value { font-size: 22px; font-weight: 700; }

        /* Elementi lista stile iOS Form */
        .ios-list { background: var(--bg-card); border-radius: var(--radius-ios); overflow: hidden; margin-bottom: 1.25rem; }
        .ios-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .ios-list-item:last-child { border-bottom: none; }
        .ios-list-item .left-info { display: flex; flex-direction: column; gap: 2px; }
        .ios-list-item .main-txt { font-weight: 600; }
        .ios-list-item .sub-txt { font-size: 12px; color: var(--text-muted); }
        .ios-list-item .right-val { font-family: monospace; font-weight: 600; text-align: right; font-size: 14px; }

        /* Pulsanti Rotondi */
        .btn-round { 
            display: inline-block; width: 100%; padding: 14px; border-radius: var(--radius-round); 
            font-size: 15px; font-weight: 700; border: none; cursor: pointer; 
            text-align: center; transition: background 0.2s, transform 0.1s; background: var(--secondary); color: white;
        }
        .btn-round:active { transform: scale(0.98); opacity: 0.9; }
        .btn-round.danger { background: var(--danger); }
        .btn-round.success { background: var(--primary); }
        .btn-round.accent { background: var(--accent); color: black; }

        /* Input Form arrotondati */
        .ios-input-group { margin-bottom: 12px; }
        .ios-input-group label { display: block; font-size: 11px; color: var(--text-muted); margin-left: 4px; margin-bottom: 4px; text-transform: uppercase; }
        .ios-input { width: 100%; padding: 12px 16px; background: var(--bg-card-inner); border: 1px solid var(--border); border-radius: var(--radius-ios); color: white; font-size: 14px; outline: none; }
        .ios-input:focus { border-color: var(--secondary); }

        /* Grafici */
        .chart-container { height: 160px; position: relative; margin-bottom: 10px; }

        /* Mappa */
        #map { width: 100%; height: 340px; border-radius: var(--radius-ios); border: 1px solid var(--border); margin-top: 10px; z-index: 1; }

        /* AI Card */
        .ai-bubble-box { background: var(--bg-card); border: 1px solid var(--secondary); padding: 1.25rem; border-radius: var(--radius-ios); font-size: 14px; line-height: 1.5; }
        .ai-node { margin-bottom: 10px; padding-left: 18px; position: relative; color: var(--text-main); }
        .ai-node::before { content: '•'; position: absolute; left: 0; color: var(--secondary); font-weight: bold; font-size: 16px; top: -2px; }

        /* BARRA DI NAVIGAZIONE IN BASSO (TAB BAR RIGIDA MINIMALE) */
        .ios-tab-bar {
            position: fixed; bottom: 0; left: 0; right: 0; height: 65px;
            background: #111827; border-top: 1px solid var(--border); display: flex; justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom); z-index: 999;
        }
        .ios-tab-item {
            background: none; border: none; color: var(--text-muted);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 600; cursor: pointer; padding: 4px 0; width: 20%; transition: color 0.15s;
        }
        .ios-tab-item.active { color: var(--primary); }
        .ios-tab-icon-svg { width: 20px; height: 20px; margin-bottom: 4px; fill: currentColor; }
        
        .negative { color: var(--danger); }
        .positive { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="ios-header">
        <div class="ios-subtitle" id="ios-view-ctx">Mese Corrente</div>
        <h1 id="ios-main-title">Dashboard</h1>
    </div>

    <div id="panel-dashboard" class="section-panel active">
        <div class="ios-grid" id="dash-cards-grid"></div>
        
        <div class="ios-card">
            <div class="ios-card-title">Dettaglio Analitico Fiscale</div>
            <div class="ios-list" id="dash-tax-list"></div>
        </div>

        <div class="ios-card">
            <div class="ios-card-title">Andamento Ore</div>
            <div class="chart-container"><canvas id="barChart"></canvas></div>
        </div>
        <div class="ios-card">
            <div class="ios-card-title">Ripartizione Finanziaria</div>
            <div class="chart-container"><canvas id="donutChart"></canvas></div>
        </div>
    </div>

    <div id="panel-attivita" class="section-panel">
        <div class="ios-card">
            <div class="ios-card-title" style="color: var(--secondary);">Nuova Giornata</div>
            <div class="ios-grid" style="grid-template-columns: 1fr 1fr;">
                <div class="ios-input-group"><label>Data</label><input type="date" id="inp-data" class="ios-input"></div>
                <div class="ios-input-group"><label>Località</label><input type="text" id="inp-luogo" placeholder="Es. Scandiano" class="ios-input"></div>
            </div>
            <div class="ios-grid" style="grid-template-columns: 1.2fr 0.9fr 0.9fr;">
                <div class="ios-input-group">
                    <label>Tipo</label>
                    <select id="inp-tipo" class="ios-input" onchange="updateDefaultExtra()">
                        <option value="Trasferta">Trasferta</option>
                        <option value="Ufficio">Ufficio</option>
                    </select>
                </div>
                <div class="ios-input-group"><label>Inizio</label><input type="time" id="inp-ora-inizio" value="08:00" class="ios-input"></div>
                <div class="ios-input-group"><label>Fine</label><input type="time" id="inp-ora-fine" value="17:00" class="ios-input"></div>
            </div>
            <div class="ios-grid" style="grid-template-columns: repeat(3, 1fr);">
                <div class="ios-input-group"><label>Compenso (€)</label><input type="number" id="inp-compenso" value="105" class="ios-input"></div>
                <div class="ios-input-group"><label>Extra (€)</label><input type="number" id="inp-extra" value="20" class="ios-input"></div>
                <div class="ios-input-group"><label>Spese (€)</label><input type="number" id="inp-spese" value="0" class="ios-input"></div>
            </div>
            <button class="btn-round success" onclick="addEntry()">Salva Giornata</button>
        </div>

        <div class="ios-card">
            <div class="ios-card-title">Attività del Mese</div>
            <div class="ios-list" id="activity-ios-list"></div>
        </div>
    </div>

    <div id="panel-mappa" class="section-panel">
        <div class="ios-card">
            <div class="ios-card-title">Ubicazione Attività</div>
            <div id="map"></div>
        </div>
    </div>

    <div id="panel-impostazioni" class="section-panel">
        <div class="ios-card">
            <div class="ios-card-title">Archivio e Backup</div>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="btn-round success" onclick="archiveMonth()">Archivia Mese Attuale</button>
                <button class="btn-round" onclick="exportToCSV()">Esporta Dati (CSV)</button>
            </div>
        </div>

        <div class="ios-card">
            <div class="ios-card-title">Parametri Fiscali</div>
            <div class="ios-input-group"><label>Coefficiente Redditività (%)</label><input type="number" id="p-coeff" value="78" class="ios-input" onchange="saveParams()"></div>
            <div class="ios-input-group"><label>Imposta Sostitutiva (%)</label><input type="number" id="p-tasse" value="5" class="ios-input" onchange="saveParams()"></div>
            <div class="ios-input-group"><label>Contributo CIPAG (%)</label><input type="number" id="p-cipag" value="12" class="ios-input" onchange="saveParams()"></div>
            <div class="ios-input-group"><label>Commercialista Mensile (€)</label><input type="number" id="p-comm" value="60" class="ios-input" onchange="saveParams()"></div>
            <div class="ios-input-group"><label>Quota Ordine Mensile (€)</label><input type="number" id="p-ordine" value="15.42" class="ios-input" onchange="saveParams()"></div>
        </div>

        <div class="ios-card">
            <div class="ios-card-title">Storico Mesi Archiviati</div>
            <div class="ios-list" id="archive-ios-list"></div>
        </div>
    </div>

    <div id="panel-ai" class="section-panel">
        <div class="ios-card">
            <div class="ios-card-title">Analisi Suggerimenti AI</div>
            <div class="ai-bubble-box" id="ai-insights-box">Aggiungere attività correnti per elaborare l'analisi dei parametri.</div>
        </div>
    </div>
</div>

<div class="ios-tab-bar">
    <button class="ios-tab-item active" onclick="navTo('panel-dashboard', 'Dashboard', this)">
        <svg class="ios-tab-icon-svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
        <div>Dashboard</div>
    </button>
    <button class="ios-tab-item" onclick="navTo('panel-attivita', 'Attività', this)">
        <svg class="ios-tab-icon-svg" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        <div>Attività</div>
    </button>
    <button class="ios-tab-item" onclick="navTo('panel-mappa', 'Mappa', this); initMapOnce();">
        <svg class="ios-tab-icon-svg" viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg>
        <div>Mappa</div>
    </button>
    <button class="ios-tab-item" onclick="navTo('panel-impostazioni', 'Configurazione', this)">
        <svg class="ios-tab-icon-svg" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <div>Config</div>
    </button>
    <button class="ios-tab-item" onclick="navTo('panel-ai', 'Intelligence', this)">
        <svg class="ios-tab-icon-svg" viewBox="0 0 24 24"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm1-6h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
        <div>AI</div>
    </button>
</div>

<script>
let entries = [];
let archive = [];
let params = { coeff: 78, tasse: 5, cipag: 12, integ: 4, comm: 60, ordine: 15.42 };
let viewName = "Mese Corrente";
let charts = {};
let map = null;
let mapMarkers = [];

const FALLBACK_DATA = [
  {data:"2026-05-01",luogo:"Reggio Emilia",tipo:"Trasferta",oraInizio:"08:00",oraFine:"17:00",compenso:105,extra:20,spese:5},
  {data:"2026-05-12",luogo:"Modena Centro",tipo:"Ufficio",oraInizio:"09:00",oraFine:"18:00",compenso:105,extra:8,spese:0}
];

function calcolaOre(inizio, fine) {
    if (!inizio || !fine) return 0;
    const [h1, m1] = inizio.split(':').map(Number);
    const [h2, m2] = fine.split(':').map(Number);
    return Math.max(0, ((h2 * 60 + m2) - (h1 * 60 + m1)) / 60);
}

function formatOre(ore) {
    const h = Math.floor(ore);
    const m = Math.round((ore - h) * 60);
    return m === 0 ? `${h}h` : `${h}h ${m}m`;
}

function navTo(panelId, titleText, btnEl) {
    document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.ios-tab-item').forEach(t => t.classList.remove('active'));
    document.getElementById(panelId).classList.add('active');
    btnEl.classList.add('active');
    document.getElementById('ios-main-title').innerText = titleText;
    if(panelId === 'panel-impostazioni') renderArchive();
}

function loadFromStorage() {
    const le = localStorage.getItem("ios_gd_entries");
    const la = localStorage.getItem("ios_gd_archive");
    const lp = localStorage.getItem("ios_gd_params");
    if(le) entries = JSON.parse(le); else entries = FALLBACK_DATA;
    if(la) archive = JSON.parse(la);
    if(lp) {
        params = JSON.parse(lp);
        document.getElementById('p-coeff').value = params.coeff;
        document.getElementById('p-tasse').value = params.tasse;
        document.getElementById('p-cipag').value = params.cipag;
        document.getElementById('p-comm').value = params.comm;
        document.getElementById('p-ordine').value = params.ordine;
    }
    render();
}

function saveToStorage() {
    localStorage.setItem("ios_gd_entries", JSON.stringify(entries));
    localStorage.setItem("ios_gd_archive", JSON.stringify(archive));
    localStorage.setItem("ios_gd_params", JSON.stringify(params));
}

function calculate(dataArray) {
    let lordoFatturabile = 0, buoniPasto = 0, speseVive = 0, totalOre = 0;
    let nTrasferte = 0, nUfficio = 0;
    dataArray.forEach(e => {
        if (e.tipo === 'Ufficio') { lordoFatturabile += e.compenso; buoniPasto += e.extra; nUfficio++; }
        else { lordoFatturabile += (e.compenso + e.extra); nTrasferte++; }
        speseVive += e.spese;
        totalOre += calcolaOre(e.oraInizio, e.oraFine);
    });
    const baseImp = lordoFatturabile * (params.coeff / 100);
    const imposta = baseImp * (params.tasse / 100);
    const cipagSogg = baseImp * (params.cipag / 100);
    const netto = (lordoFatturabile - imposta - cipagSogg - params.comm - params.ordine) + buoniPasto - speseVive;
    return { lordoFatturabile, buoniPasto, baseImp, imposta, cipagSogg, netto, speseVive, totalOre, nTrasferte, nUfficio };
}

function render() {
    const d = calculate(entries);
    document.getElementById('ios-view-ctx').innerText = viewName.toUpperCase();

    document.getElementById('dash-cards-grid').innerHTML = `
        <div class="ios-stat-box"><div class="label">Lordo Totale</div><div class="value">€ ${d.lordoFatturabile.toFixed(2)}</div></div>
        <div class="ios-stat-box"><div class="label">Netto Reale</div><div class="value" style="color:var(--primary)">€ ${d.netto.toFixed(2)}</div></div>
        <div class="ios-stat-box"><div class="label">Ore Lavorate</div><div class="value" style="color:var(--secondary)">${formatOre(d.totalOre)}</div></div>
        <div class="ios-stat-box"><div class="label">Spese Vive</div><div class="value" style="color:var(--danger)">€ ${d.speseVive.toFixed(2)}</div></div>
    `;

    document.getElementById('dash-tax-list').innerHTML = `
        <div class="ios-list-item"><span>Base Imponibile (${params.coeff}%)</span><span class="right-val">€ ${d.baseImp.toFixed(2)}</span></div>
        <div class="ios-list-item"><span>Imposta Sostitutiva (${params.tasse}%)</span><span class="right-val negative">- € ${d.imposta.toFixed(2)}</span></div>
        <div class="ios-list-item"><span>CIPAG Previdenza (${params.cipag}%)</span><span class="right-val negative">- € ${d.cipagSogg.toFixed(2)}</span></div>
        <div class="ios-list-item"><span>Costi Fissi Gestione</span><span class="right-val negative">- € ${(params.comm + params.ordine).toFixed(2)}</span></div>
        <div class="ios-list-item"><span>Indennità / Extra Totali</span><span class="right-val positive">+ € ${d.buoniPasto.toFixed(2)}</span></div>
    `;

    const sorted = [...entries].sort((a,b) => new Date(a.data) - new Date(b.data));
    document.getElementById('activity-ios-list').innerHTML = sorted.length === 0 ? `<div style="padding:15px; text-align:center; color:var(--text-muted); font-size:14px;">Nessuna attività registrata.</div>` : sorted.map(e => {
        const ore = calcolaOre(e.oraInizio, e.oraFine);
        const tGiorno = e.compenso + e.extra - e.spese;
        return `
        <div class="ios-list-item">
            <div class="left-info">
                <span class="main-txt">${e.luogo} <small style="color:${e.tipo==='Ufficio'?'var(--secondary)':'var(--primary)'}">(${e.tipo})</small></span>
                <span class="sub-txt">${e.data.split('-').reverse().join('/')} | Ore: ${formatOre(ore)}</span>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <span class="right-val">€ ${tGiorno.toFixed(2)}</span>
                <button onclick="deleteEntry(${entries.indexOf(e)})" style="background:none; border:none; color:var(--danger); font-weight:bold; font-size:16px; cursor:pointer;">✕</button>
            </div>
        </div>`
    }).join('');

    updateCharts(d);
    generateAIInsights(d);
    if(map) updateMapMarkers();
}

window.addEntry = function() {
    const d = document.getElementById('inp-data').value;
    const l = document.getElementById('inp-luogo').value;
    const t = document.getElementById('inp-tipo').value;
    const i = document.getElementById('inp-ora-inizio').value;
    const f = document.getElementById('inp-ora-fine').value;
    const c = parseFloat(document.getElementById('inp-compenso').value)||0;
    const ex = parseFloat(document.getElementById('inp-extra').value)||0;
    const s = parseFloat(document.getElementById('inp-spese').value)||0;

    if(!d || !l) return alert("Inserire data e località!");
    entries.push({ data: d, luogo: l, tipo: t, oraInizio: i, oraFine: f, compenso: c, extra: ex, spese: s });
    document.getElementById('inp-luogo').value = '';
    render(); saveToStorage();
}

window.deleteEntry = function(index) {
    if(confirm("Eliminare la giornata selezionata?")) {
        entries.splice(index, 1);
        render(); saveToStorage();
    }
}

window.updateDefaultExtra = function() {
    document.getElementById('inp-extra').value = (document.getElementById('inp-tipo').value === 'Trasferta') ? 20 : 8;
}

window.saveParams = function() {
    params = {
        coeff: parseFloat(document.getElementById('p-coeff').value)||0,
        tasse: parseFloat(document.getElementById('p-tasse').value)||0,
        cipag: parseFloat(document.getElementById('p-cipag').value)||0,
        comm: parseFloat(document.getElementById('p-comm').value)||0,
        ordine: parseFloat(document.getElementById('p-ordine').value)||0
    };
    render(); saveToStorage();
}

function initMapOnce() {
    if (map !== null) { setTimeout(() => { map.invalidateSize(); }, 200); return; }
    map = L.map('map').setView([42.8, 12.5], 5);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    updateMapMarkers();
}

async function updateMapMarkers() {
    if(!map) return;
    mapMarkers.forEach(m => map.removeLayer(m));
    mapMarkers = [];

    const grouped = {};
    entries.forEach(e => { if(!grouped[e.luogo]) grouped[e.luogo] = []; grouped[e.luogo].push(e); });

    for (let luogo in grouped) {
        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(luogo)}&limit=1`);
            const data = await response.json();
            if(data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);
                let somma = 0;
                grouped[luogo].forEach(g => somma += (g.compenso + g.extra - g.spese));
                
                const marker = L.marker([lat, lon]).addTo(map).bindPopup(`<b style="color:black">${luogo}</b><br/><span style="color:black">Totale Netto: € ${somma.toFixed(2)}</span>`);
                mapMarkers.push(marker);
            }
        } catch (err) { console.error(err); }
    }
}

window.archiveMonth = function() {
    if(entries.length === 0) return alert("Nessun dato presente.");
    const nomeMese = new Date(entries[0].data).toLocaleString('it-IT', { month: 'long', year: 'numeric' }).toUpperCase();
    if(confirm(`Archiviare il mese di ${nomeMese}?`)) {
        archive.push({ nome: nomeMese, dati: [...entries] });
        entries = []; viewName = "Mese Corrente";
        render(); saveToStorage();
    }
}

window.renderArchive = function() {
    const container = document.getElementById('archive-ios-list');
    if(archive.length === 0) { container.innerHTML = `<div style="padding:15px; text-align:center; color:var(--text-muted);">Archivio vuoto.</div>`; return; }
    container.innerHTML = [...archive].reverse().map((m, i) => {
        const c = calculate(m.dati); const realIdx = archive.length - 1 - i;
        return `
        <div class="ios-list-item">
            <div class="left-info">
                <span class="main-txt" style="color:var(--primary)">${m.nome}</span>
                <span class="sub-txt">${m.dati.length} giorni | Ore: ${formatOre(c.totalOre)}</span>
            </div>
            <div style="display:flex; gap:8px;">
                <button onclick="loadArchive(${realIdx})" style="background:var(--bg-card-inner); border:1px solid var(--border); color:white; padding:5px 10px; border-radius:8px; font-size:12px; font-weight:bold;">Vedi</button>
                <button onclick="deleteArchive(${realIdx})" style="background:none; border:none; color:var(--danger); font-weight:bold; padding:0 5px;">✕</button>
            </div>
        </div>`;
    }).join('');
}

window.loadArchive = function(idx) {
    entries = [...archive[idx].dati];
    viewName = archive[idx].nome + " (Archivio)";
    render();
    navTo('panel-dashboard', 'Dashboard', document.querySelector('.ios-tab-bar').children[0]);
}

window.deleteArchive = function(index) {
    if(confirm("Eliminare permanentemente dall'archivio?")) {
        archive.splice(index, 1); window.renderArchive(); saveToStorage();
    }
}

window.exportToCSV = function() {
    let csv = "Mese;Data;Localita;Tipo;Inizio;Fine;Tariffa;Extra;Spese\n";
    entries.forEach(e => { csv += `Corrente;${e.data};"${e.luogo}";${e.tipo};${e.oraInizio};${e.oraFine};${e.compenso};${e.extra};${e.spese}\n`; });
    archive.forEach(m => { m.dati.forEach(e => { csv += `${m.nome};${e.data};"${e.luogo}";${e.tipo};${e.oraInizio};${e.oraFine};${e.compenso};${e.extra};${e.spese}\n`; }); });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.setAttribute("download", "GeoDash_Backup.csv");
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
}

function generateAIInsights(d) {
    const box = document.getElementById('ai-insights-box');
    if(entries.length === 0) return;
    const pNetta = d.totalOre > 0 ? (d.netto / d.totalOre) : 0;
    let html = `<div class="ai-node"><b>Efficienza Oraria:</b> Generi un netto reale netto-tasse di <b>€ ${pNetta.toFixed(2)}/ora</b>.</div>`;
    html += `<div class="ai-node"><b>Distribuzione Territoriale:</b> Svolgi attività in <b>${Object.keys(entries.reduce((acc,curr)=>{acc[curr.luogo]=1;return acc;},{})).length} località esterne</b> diverse questo mese. Accorpare i viaggi riduce l'incidenza di spese non deducibili.</div>`;
    box.innerHTML = html;
}

function updateCharts(d) {
    const opt = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' } }, x: { ticks: { color: '#9ca3af' }, grid: { display: false } } } };
    if(charts.b) charts.b.destroy(); if(charts.d) charts.d.destroy();
    
    const sorted = [...entries].sort((a,b) => new Date(a.data) - new Date(b.data));
    charts.b = new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: { labels: sorted.map(e => e.data.split('-')[2]), datasets: [{ data: sorted.map(e => calcolaOre(e.oraInizio, e.oraFine)), backgroundColor: '#3b82f6', borderRadius: 4 }] },
        options: opt
    });
    
    charts.d = new Chart(document.getElementById('donutChart'), {
        type: 'pie',
        data: { labels: ['Netto','Tasse/Cassa','Fissi/Spese'], datasets: [{ data: [Math.max(0, d.netto), d.imposta+d.cipagSogg, params.comm+params.ordine+d.speseVive], backgroundColor: ['#10b981','#ef4444','#f59e0b'], borderWidth: 0 }] },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

document.getElementById('inp-data').valueAsDate = new Date();
loadFromStorage();
</script>
