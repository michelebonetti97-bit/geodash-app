<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoDash Pro</title>
    <style>
        :root {
            --bg-main: #000000;
            --bg-card: #111827;
            --primary: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #374151;
        }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 100px; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        
        .section-panel { display: none; }
        .section-panel.active { display: block; }
        
        .card { background: var(--bg-card); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: var(--primary); }
        
        .ios-input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); border-radius: 8px; color: white; margin-bottom: 10px; }
        .result-box { background: var(--primary); color: #000; padding: 15px; border-radius: 8px; font-weight: 800; text-align: center; margin-top: 10px; font-size: 1.2rem; }
        
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #000; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid var(--border); z-index: 1000; }
        .tab-item { cursor: pointer; color: var(--text-muted); font-size: 10px; font-weight: 700; text-align: center; }
        .tab-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h1 style="margin-bottom:20px;">GeoDash <span style="color:var(--primary)">Pro</span></h1>

    <div id="panel-toolbox" class="section-panel active">
        <div class="card">
            <div class="card-title">Calcolatore Parcelle Tecniche</div>
            <select id="tool-type" class="ios-input" onchange="calcParcella()">
                <optgroup label="Geofisica">
                    <option value="150">HVSR</option>
                    <option value="400">MASW / ReMi</option>
                    <option value="500">FDEM / ERT</option>
                </optgroup>
                <optgroup label="Geotecnica">
                    <option value="350">CPT / CPTU</option>
                    <option value="250">DPSH / SPT</option>
                </optgroup>
                <optgroup label="Idrogeologia">
                    <option value="600">Relazione Idrogeologica</option>
                </optgroup>
            </select>
            <input type="number" id="tool-qty" class="ios-input" placeholder="Quantità (n° punti/indagini)" oninput="calcParcella()">
            <div class="result-box" id="result-price">Stima: € 0</div>
        </div>
    </div>

    <div id="panel-ai" class="section-panel">
        <div class="card">
            <div class="card-title">Radar Opportunità</div>
            <a href="https://www.inpa.gov.it/" class="ios-input" style="display:block; text-decoration:none;">inPA Concorsi ↗</a>
            <a href="https://www.cngeologi.it/category/bandi-e-concorsi/" class="ios-input" style="display:block; text-decoration:none;">CNG Bandi ↗</a>
        </div>
    </div>
</div>

<nav class="tab-bar">
    <div class="tab-item active" onclick="nav('panel-toolbox', this)">TOOLBOX</div>
    <div class="tab-item" onclick="nav('panel-ai', this)">AI & BANDI</div>
</nav>

<script>
    function nav(id, el) {
        document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    function calcParcella() {
        const val = document.getElementById('tool-type').value;
        const qty = parseInt(document.getElementById('tool-qty').value) || 0;
        const total = parseInt(val) * qty;
        document.getElementById('result-price').innerText = `Stima: € ${total}`;
    }
</script>
</body>
</html>
