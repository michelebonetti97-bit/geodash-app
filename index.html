<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoDash Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-main: #0f1117;       /* Grigio notte profondo */
            --bg-card: #1c1f26;       /* Antracite morbido */
            --bg-input: #2d333b;      /* Grigio input */
            --primary: #10b981;       /* Verde Smeraldo GeoDash */
            --secondary: #3b82f6;     /* Blu Elettrico */
            --text-main: #f9fafb;
            --text-muted: #94a3b8;
            --border: #374151;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 90px; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        /* Header */
        .ios-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .ios-header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .ios-header h1 span { color: var(--primary); }
        .ios-subtitle { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; background: var(--bg-card); padding: 4px 10px; border-radius: 8px; }

        /* Componenti */
        .section-panel { display: none; }
        .section-panel.active { display: block; }
        .card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
        .card-title { font-size: 15px; font-weight: 700; margin-bottom: 15px; display: flex; justify-content: space-between; }

        /* Bandi & AI */
        .bando-card { background: rgba(59, 130, 246, 0.1); border: 1px solid var(--secondary); border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .bando-title { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .bando-link { color: var(--secondary); font-size: 12px; text-decoration: none; font-weight: 500; }

        /* UI Elementi */
        .btn-main { background: var(--primary); color: #000; width: 100%; padding: 14px; border: none; border-radius: 24px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .input-group { margin-bottom: 10px; }
        .input-field { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; color: white; }

        /* Tab Bar */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(28, 31, 38, 0.9); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--border); }
        .tab-item { cursor: pointer; text-align: center; color: var(--text-muted); font-size: 10px; font-weight: 600; }
        .tab-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="ios-header">
        <h1>GeoDash <span>Pro</span></h1>
        <div class="ios-subtitle" id="view-title">Dashboard</div>
    </div>

    <div id="panel-dashboard" class="section-panel active">
        <div class="card">
            <div class="card-title">Riepilogo Mese</div>
            <div id="stats-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
        </div>
        <div class="card"><div class="card-title">Andamento</div><canvas id="barChart"></canvas></div>
    </div>

    <div id="panel-ai" class="section-panel">
        <div class="card-title">Radar Bandi & Opportunità</div>
        <div class="bando-card">
            <span class="bando-title">Concorsi Pubblici (inPA)</span>
            <a href="https://www.inpa.gov.it/" class="bando-link">Esplora posizioni Geologo →</a>
        </div>
        <div class="bando-card">
            <span class="bando-title">Consiglio Nazionale Geologi</span>
            <a href="https://www.cngeologi.it/category/bandi-e-concorsi/" class="bando-link">Vai al portale bandi →</a>
        </div>
        <div class="card" style="margin-top:20px;">
            <div class="card-title">AI Insight</div>
            <div id="ai-text" style="font-size: 14px; color: var(--text-muted);">Inserisci attività per analisi predittiva.</div>
        </div>
    </div>
</div>

<nav class="tab-bar">
    <div class="tab-item active" onclick="nav('panel-dashboard', this, 'Dashboard')">DASHBOARD</div>
    <div class="tab-item" onclick="nav('panel-ai', this, 'Intelligence')">AI & BANDI</div>
</nav>

<script>
    function nav(id, el, title) {
        document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
        document.getElementById('view-title').innerText = title;
    }
</script>
</body>
</html>
